name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Show directory
      run: |
        pwd
        ls -la
        ls -la app/
    
    - name: Show libs
      run: |
        ls -la app/libs/
    
    - name: Build with Gradle
      run: |
        ./gradlew assembleDebug --stacktrace 2>&1 || true
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK generated"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
